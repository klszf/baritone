name: Java CI with Gradle

on:
  push:
  pull_request:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: 1.21.1  # 确保构建 1.21.1 分支

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle (NeoForge)
      run: ./gradlew :neoforge:build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"

    - name: Upload NeoForge Artifact
      uses: actions/upload-artifact@v4
      with:
        name: baritone-neoforge
        path: neoforge/build/libs/*.jar  # 上传 NeoForge 构建的 JAR
